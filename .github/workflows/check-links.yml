name: 断链检查

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 校验全站链接与锚点（nav.js / search-index.json / 各页面）
        run: python scripts/check_links.py
